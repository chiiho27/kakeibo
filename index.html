<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#F3F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家計簿</title>
<style>
/* くすみカラー4色：セージ / ブルーグレー / ローズ / サンド（-ink はその色の濃い版で文字用） */
:root {
  --bg: #F3F0EB; --card: #FCFBF9; --text: #3B3936; --sub: #8C877F; --line: #E7E2DA; --chip: #ECE8E1;
  --c1: #88A08B; --c2: #8E9FB3; --c3: #C79A90; --c4: #CDB48C;
  --c1-ink: #5E7562; --c2-ink: #5F7187; --c3-ink: #A0675D; --c4-ink: #8B7146;
  --accent: var(--c1-ink); --on-accent: #fff;
  --shadow: 0 1px 2px rgba(60,50,40,.05), 0 6px 20px rgba(60,50,40,.05);
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1C1B19; --card: #262522; --text: #ECE8E1; --sub: #A39D94; --line: #36332F; --chip: #302E2B;
    --c1: #9CB39F; --c2: #A3B2C4; --c3: #D5AAA1; --c4: #D9C29C;
    --c1-ink: #B3C7B5; --c2-ink: #B8C5D4; --c3-ink: #E2BAB2; --c4-ink: #E3CFAD;
    --accent: var(--c1); --on-accent: #1C1B19;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom)); overscroll-behavior-y: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:active { opacity: .7; }
.num { font-variant-numeric: tabular-nums; }
.neg { color: var(--c3-ink) !important; }
.muted { color: var(--sub); font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); display: grid;
  grid-template-columns: 44px 1fr 44px 44px; align-items: center; padding: 6px 8px 6px 8px; }
header .nav { height: 44px; font-size: 22px; color: var(--sub); }
header .mlabel { font-size: 17px; font-weight: 700; letter-spacing: .02em; height: 44px; }
header .gear { height: 44px; display: grid; place-items: center; color: var(--sub); }
header .gear.on { color: var(--accent); }
.syncline { font-size: 11px; color: var(--c4-ink); text-align: center; margin: -4px 16px 4px; }
.syncline:empty { display: none; }

main { padding: 4px 16px 16px; animation: fade .18s ease; }
main.slide-l { animation: slideL .22s ease; } main.slide-r { animation: slideR .22s ease; }
@keyframes fade { from { opacity: 0; } }
@keyframes slideL { from { opacity: 0; transform: translateX(24px); } }
@keyframes slideR { from { opacity: 0; transform: translateX(-24px); } }

.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
.card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card-head button { color: var(--accent); font-size: 13px; }
.label { font-size: 12px; color: var(--sub); margin: 18px 6px 8px; font-weight: 600; letter-spacing: .04em; }

/* hero */
.hero { display: flex; gap: 16px; align-items: center; padding: 18px; }
.ring-wrap { position: relative; flex: none; }
.ring-wrap svg { display: block; }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label small { font-size: 10px; color: var(--sub); }
.ring-label b { font-size: 18px; font-variant-numeric: tabular-nums; }
.hero-text { min-width: 0; }
.hero-text small { font-size: 12px; color: var(--sub); }
.hero-text .big { font-size: 30px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin: 2px 0 4px; white-space: nowrap; }
.hero-text .sub { font-size: 12px; color: var(--sub); line-height: 1.5; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stats div { background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.stats small { display: block; font-size: 11px; color: var(--sub); margin-bottom: 2px; }
.stats b { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

details.fold summary { list-style: none; display: flex; justify-content: space-between; padding: 14px 16px; font-size: 14px; font-weight: 600; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary span { font-variant-numeric: tabular-nums; }
details.fold summary::after { content: '›'; color: var(--sub); margin-left: 8px; transition: transform .2s; }
details.fold[open] summary::after { transform: rotate(90deg); }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 14px; }
.kv span:last-child { font-variant-numeric: tabular-nums; }
.kv small { color: var(--sub); }
.kv.em { font-weight: 700; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 6px 10px 12px; }
.cal .wd { text-align: center; font-size: 10px; color: var(--sub); padding: 2px 0; }
.cal .wd.sun { color: var(--c3-ink); } .cal .wd.sat { color: var(--c2-ink); }
.cal button { aspect-ratio: 1 / 1.08; border-radius: 10px; background: var(--chip); display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; padding: 4px 1px 3px; }
.cal button.future { background: transparent; }
.cal button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal .dn { font-size: 10px; color: var(--sub); }
.cal .dv { font-size: 9.5px; font-variant-numeric: tabular-nums; color: var(--c3-ink); font-weight: 600; letter-spacing: -.02em; }
.cal .ds { font-size: 17px; line-height: 1; }

/* pills */
.hscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 12px 16px 4px; }
.hscroll::-webkit-scrollbar { display: none; }
.pill { flex: none; display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 12px; font-size: 13px;
  background: var(--chip); color: var(--text); white-space: nowrap; }
.pill.on { background: var(--text); color: var(--bg); }

/* bars */
.bar-row { padding: 11px 16px; border-top: 1px solid var(--line); }
.bar-row.first { border-top: 0; }
.bar-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 7px; }
.bar-row .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .top span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row .top small { color: var(--sub); }
.bar-row.total .top { font-weight: 700; }
.bar { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; transition: width .4s ease; }
.diff { font-size: 11px; color: var(--sub); margin-top: 5px; text-align: right; font-variant-numeric: tabular-nums; }
.diff.over { color: var(--c3-ink); font-weight: 600; }
.empty { text-align: center; color: var(--sub); padding: 40px 16px; font-size: 14px; line-height: 1.8; }
.empty .em { font-size: 34px; display: block; margin-bottom: 6px; }

/* list */
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 0 12px; box-shadow: var(--shadow); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 11px 0; font-size: 16px; outline: none; }
.search svg { color: var(--sub); flex: none; }
.filters { padding: 10px 0 2px; }
.day { margin-top: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin: 0 6px 6px; font-weight: 600; }
.day-head span:last-child { font-variant-numeric: tabular-nums; font-weight: 400; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; width: 100%; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; }
.item .t { font-size: 15px; }
.item .s { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.item .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; font-size: 15px; }
.item .amt.in { color: var(--c1-ink); }
.item .sat { display: block; font-size: 11px; color: var(--sub); font-weight: 400; margin-top: 2px; }

/* week */
.weeks { padding: 0 0 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.weeks .pill { flex-direction: column; gap: 0; padding: 7px 14px; line-height: 1.35; font-size: 12px; }
.weeks .pill b { font-size: 13px; }

/* year table */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; white-space: nowrap; text-align: right; border-top: 1px solid var(--line); }
th { color: var(--sub); font-weight: 600; border-top: 0; font-size: 11px; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--card); text-align: left; max-width: 128px;
  overflow: hidden; text-overflow: ellipsis; }
tr.grp td { font-weight: 700; }
/* flex goes on an inner span: a flex <td> stops being a table cell and loses position: sticky */
tr.grp td:first-child span { display: flex; align-items: center; gap: 6px; }
tr.total td { font-weight: 700; background: var(--chip); }
tr.total td:first-child { background: var(--chip); }
.mbars { padding: 6px 16px 14px; display: grid; gap: 8px; }
.mbar { display: grid; grid-template-columns: 30px 1fr 84px; gap: 8px; align-items: center; font-size: 12px; }
.mbar .tracks { display: grid; gap: 3px; }
.mbar .tracks i { display: block; height: 5px; border-radius: 3px; }
.mbar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; padding: 0 16px 12px; font-size: 11px; color: var(--sub); }
.legend span { display: flex; align-items: center; gap: 5px; }

/* settings */
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 13px 16px; border-top: 1px solid var(--line); font-size: 15px; }
.row:first-child { border-top: 0; }
.row .r { color: var(--sub); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.act { color: var(--accent); }
.row.danger { color: var(--c3-ink); }
.row.act::after, .row.nav::after { content: '›'; color: var(--sub); }
.sub-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); padding: 12px 16px 6px; border-top: 1px solid var(--line); font-weight: 600; }
.sub-head:first-child { border-top: 0; }
.tag { font-size: 10px; border-radius: 6px; padding: 1px 6px; background: var(--chip); color: var(--sub); margin-left: 2px; }
.note { font-size: 12px; color: var(--sub); margin: 8px 6px 4px; line-height: 1.7; }
.note.err { color: var(--c3-ink); }
.inline-field { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.inline-field:first-child { border-top: 0; }
.inline-field > span { width: 56px; flex: none; color: var(--sub); font-size: 14px; }
.inline-field input, .inline-field select { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; outline: none; }
.stamp-preview { display: flex; align-items: center; gap: 14px; padding: 16px; }
.stamp-preview .big { font-size: 34px; letter-spacing: 4px; }
.stamp-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 0 16px 14px; }
.stamp-grid button { aspect-ratio: 1; border-radius: 12px; background: var(--chip); font-size: 22px; position: relative; }
.stamp-grid button.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--card); }
.stamp-grid button i { position: absolute; top: 2px; right: 4px; font-size: 9px; font-style: normal; color: var(--accent); font-weight: 700; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr);
  align-items: end; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--sub); padding: 4px 0; }
.tabbar button.on { color: var(--accent); }
.tabbar .addbtn { align-self: center; }
.tabbar .addbtn span { width: 52px; height: 52px; border-radius: 26px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; box-shadow: 0 6px 16px rgba(60,80,65,.28); margin-top: -18px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 40;
  background: var(--text); color: var(--bg); border-radius: 14px; padding: 11px 16px; font-size: 14px; display: flex; gap: 16px;
  align-items: center; opacity: 0; pointer-events: none; transition: all .22s ease; max-width: calc(100% - 32px); white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--c1); font-weight: 700; }

/* sheets */
.sheet-bg { position: fixed; inset: 0; background: rgba(30,25,20,.32); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 22px 22px 0 0;
  padding: 6px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
  max-height: 94vh; overflow-y: auto; }
.open > .sheet-bg { opacity: 1; pointer-events: auto; }
.open > .sheet { transform: none; }
.grip { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 12px; font-size: 17px; }
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg + .seg { margin-top: 6px; }
.seg button { flex: 1; padding: 8px 0; border-radius: 9px; font-size: 14px; color: var(--sub); }
.seg.small button { padding: 5px 0; font-size: 12.5px; }
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.amount { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; padding: 12px 4px 4px; }
.amount .yen { font-size: 22px; color: var(--sub); }
.amount .val { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.expr { text-align: right; font-size: 12px; color: var(--sub); min-height: 16px; padding: 0 4px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chips button { border-radius: 999px; padding: 7px 11px; font-size: 13.5px; background: var(--chip); }
.chips button.on { background: var(--kc, var(--accent)); color: #fff; }
@media (prefers-color-scheme: dark) { .chips button.on { color: #1C1B19; } }
.hint { font-size: 11.5px; color: var(--sub); margin: 2px 4px 6px; min-height: 1em; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 6px; }
.fld { display: flex; flex-direction: column; background: var(--chip); border-radius: 12px; padding: 6px 10px; min-width: 0; }
.fld.wide { grid-column: span 2; }
.fld span { font-size: 10.5px; color: var(--sub); }
.fld input, .fld select { border: 0; background: none; font-size: 15px; padding: 2px 0; outline: none; min-width: 0; width: 100%; -webkit-appearance: none; }
.satrow { display: flex; align-items: center; gap: 10px; margin: 2px 0 8px; font-size: 12px; color: var(--sub); }
.satrow .seg { flex: 1; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.keypad button { height: 48px; border-radius: 12px; background: var(--chip); font-size: 20px; font-variant-numeric: tabular-nums; }
.keypad button.fn { color: var(--sub); font-size: 17px; }
.keypad button.zero { grid-column: span 2; }
.keypad button.ok { background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; }
.sheet-foot { display: flex; justify-content: center; margin-top: 10px; }
.sheet-foot button { color: var(--c3-ink); font-size: 14px; padding: 6px 12px; }
.actions { display: flex; gap: 8px; margin-top: 14px; }
.actions button { flex: 1; border-radius: 14px; padding: 14px 0; font-size: 16px; font-weight: 600; background: var(--chip); }
.actions .save { background: var(--accent); color: var(--on-accent); }
.actions .del { color: var(--c3-ink); }
.form-list { background: var(--chip); border-radius: 14px; overflow: hidden; }
.form-list .inline-field { border-color: var(--bg); }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

.imp-row { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border-top: 1px solid var(--line); }
.imp-row:first-child { border-top: 0; }
.imp-row > input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.imp-row .body { flex: 1; min-width: 0; }
.imp-row .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imp-row small { color: var(--sub); font-size: 11px; }
.imp-row small.unk { color: var(--c4-ink); font-weight: 600; }
.imp-row select { width: 100%; margin-top: 5px; border: 0; border-radius: 8px; padding: 5px 8px; background: var(--chip); font-size: 14px; }
.imp-row b { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
.imp-row.dup { opacity: .45; }
.sticky-actions { position: sticky; bottom: calc(-14px - env(safe-area-inset-bottom)); background: var(--card); padding: 10px 0 4px; }
</style>
</head>
<body>
<header>
  <button class="nav" id="prev" aria-label="前へ">‹</button>
  <button class="mlabel" id="monthLabel" aria-label="今月に戻る"></button>
  <button class="nav" id="next" aria-label="次へ">›</button>
  <button class="gear" id="gear" aria-label="設定">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
  </button>
</header>
<p class="syncline" id="syncLine"></p>

<main id="main"></main>

<nav class="tabbar">
  <button data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6H9v6H4a.5.5 0 0 1-.5-.5z"/></svg>ホーム</button>
  <button data-tab="list"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>明細</button>
  <button class="addbtn" id="add" aria-label="記録する"><span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-tab="week"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>週予算</button>
  <button data-tab="year"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-8M10 20V5M15 20v-5M20 20V9M3 20.5h18"/></svg>年間</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <form class="sheet" id="form" autocomplete="off">
    <div class="grip"></div>
    <div class="seg" id="kindSeg">
      <button type="button" data-kind="expense">支出</button>
      <button type="button" data-kind="income">収入</button>
      <button type="button" data-kind="saving">貯金・投資</button>
    </div>
    <div class="seg small" id="subSeg">
      <button type="button" data-kubun="支出（変動費）">変動費</button>
      <button type="button" data-kubun="支出（固定費）">固定費</button>
      <button type="button" data-kubun="支出（特別費）">特別費</button>
    </div>
    <div class="amount"><span class="yen">¥</span><span class="val" id="amtVal">0</span></div>
    <div class="expr" id="amtExpr"></div>
    <div class="chips" id="fCats"></div>
    <p class="hint" id="fHint"></p>
    <div class="fields">
      <label class="fld"><span>日付</span><input type="date" id="fDate" required></label>
      <label class="fld"><span>支払方法</span><select id="fMethod"></select></label>
      <label class="fld wide"><span>詳細</span><input id="fMemo" placeholder="お店・メモ（任意）" enterkeyhint="done"></label>
    </div>
    <div class="satrow" id="satField"><span>満足度</span>
      <div class="seg small" id="satSeg">
        <button type="button" data-sat="◯">◯ よかった</button>
        <button type="button" data-sat="△">△</button>
        <button type="button" data-sat="✕">✕ 反省</button>
        <button type="button" data-sat="ー">ー</button>
      </div>
    </div>
    <div class="keypad" id="keypad">
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="back" class="fn" aria-label="1文字消す">⌫</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="plus" class="fn" aria-label="足す">＋</button>
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="clear" class="fn">C</button>
      <button type="button" data-k="0" class="zero">0</button><button type="button" data-k="00">00</button>
      <button type="submit" class="ok">保存</button>
    </div>
    <div class="sheet-foot"><button type="button" id="fDelete">この記録を削除</button></div>
  </form>
</div>

<div id="panelWrap">
  <div class="sheet-bg" id="panelBg"></div>
  <div class="sheet" id="panel"></div>
</div>

<input type="file" id="importFile" accept=".csv,text/csv" hidden>
<input type="file" id="cardFile" accept=".csv,text/csv" multiple hidden>

<script>
const K_INC = '収入', K_SAVE = '先取り貯金・投資', K_FIX = '支出（固定費）', K_VAR = '支出（変動費）', K_SP = '支出（特別費）';
const KUBUNS = [K_INC, K_SAVE, K_FIX, K_VAR, K_SP];
const SHORT = { [K_INC]: '収入', [K_SAVE]: '先取り貯金・投資', [K_FIX]: '固定費', [K_VAR]: '変動費', [K_SP]: '特別費' };
const PILL = { ...SHORT, [K_SAVE]: '貯金・投資' };
// 区分ごとの色（4色）：収入・貯金＝セージ、固定費＝ブルーグレー、変動費＝ローズ、特別費＝サンド
const KCOLOR = { [K_INC]: 'var(--c1)', [K_SAVE]: 'var(--c1)', [K_FIX]: 'var(--c2)', [K_VAR]: 'var(--c3)', [K_SP]: 'var(--c4)' };
const kcolor = k => KCOLOR[k] || 'var(--sub)';

// 初期の費目（スプレッドシート連携時に「費目管理」の内容で置き換わる）
const DEFAULT_ITEMS = (() => {
  const names = {
    [K_INC]: ['💰 パパ給与', '💰 ママ給与', '💰 パパ賞与', '💰 ママ賞与', '💰 児童手当', '💰 配当金', '💰 副業', '💰 その他'],
    [K_SAVE]: ['💴 予備費', '💴 教育費', '💴 NISA', '💴 こどもNISA', '💴 児童手当', '💴 特別費', '💴 積立型保険'],
    [K_FIX]: ['🏠 住居', '💡 電気', '🔥 ガス', '🚰 水道', '📱 通信費(ネット)', '📱 通信費(携帯）', '🎥 娯楽', '📒 自己投資・情報',
      '🏫 学童', '🎨 習い事', '🧮 お小遣い（パパ）', '🧮 お小遣い（ママ）', '🎫 医療保険・収入保障保険', '💸 債務返済・奨学金'],
    [K_VAR]: ['🍙 食費', '☕ 外食・カフェ', '🧴 日用品', '👦 こども', '👕 衣服・美容', '🕹️ 娯楽', '🍻 交際費', '🏥 医療費',
      '🚃 交通費', '💼 立替経費', '❓ その他'],
    [K_SP]: ['✈ 旅行', '🍴 お祝い', '💸 税金', '📝 火災保険', '💺 家具・家電', '🏥 特別医療費', '🎁 ギフト', '🥩 ふるさと納税',
      '🏠 帰省', '📺 年会費', '❓ その他'],
  };
  const weekly = ['🍙 食費', '☕ 外食・カフェ', '🧴 日用品', '👦 こども', '🕹️ 娯楽', '🍻 交際費', '❓ その他'];
  return KUBUNS.flatMap(k => names[k].map((h, i) => ({ kubun: k, himoku: h, methods: [], budget: 0, order: i + 1,
    weekly: k === K_VAR && weekly.includes(h), note: '' })));
})();
const DEFAULT_METHODS = ['三井住友VISAカード(S)', '三井住友VISAカード(C)', '楽天カード(C)', '楽天カード(S)', 'エポスカード(C)',
  'エポスカード(S)', '現金', '口座振替', '三菱UFJ銀行', 'ドコモSMTB銀行', 'ゆうちょ銀行', '三井住友銀行', '八十二長野銀行'];
const STAMP_PRESETS = ['🐧', '🍧', '🐱', '🐶', '🐻', '🐰', '🌸', '🍀', '🌱', '⭐️', '🌙', '☀️', '🍙', '🍓', '🧸', '💮', '👏', '🎉'];

const KEY = 'kakeibo.entries.v3';
const KEY_CFG = 'kakeibo.sync.v3';
const KEY_MASTER = 'kakeibo.master.v3';
const KEY_SPECIAL = 'kakeibo.special';
const KEY_LAST = 'kakeibo.lastUsed';
const KEY_CARDMAP = 'kakeibo.cardMap';
const KEY_PREFS = 'kakeibo.prefs';

const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let entries = read(KEY, null) ?? migrate();
let cfg = read(KEY_CFG, { url: '', token: '', lastSync: 0, error: '', ver: 0, syncedVer: 0 });
let master = read(KEY_MASTER, { items: DEFAULT_ITEMS, methods: DEFAULT_METHODS, fromSheet: false });
let specials = read(KEY_SPECIAL, {});   // { 'YYYY-MM': [{ id, name, budget, note }] }
let lastUsed = read(KEY_LAST, { kubun: K_VAR, method: '' });
let cardMap = read(KEY_CARDMAP, {});
let prefs = { stamp: '🐧🍧🐱', ...read(KEY_PREFS, {}) };   // the spreadsheet rotated 🐧🍧🐱 week by week

let cur = new Date(); cur.setDate(1);
let tab = 'home';
let weekSel = null;
let homeSeg = null;
let listFilter = 'all', listQuery = '';
let editing = null;
const f = { kubun: K_VAR, himoku: '', sat: 'ー', parts: [''] };

function migrate() {
  const v2 = read('kakeibo.entries.v2', null);
  if (v2) return v2.map(e => ({ id: e.id, created: e.created, date: e.date, amount: e.amount, kubun: e.kubun,
    himoku: e.himoku, method: e.method || '', memo: e.memo || '', satisfaction: e.satisfaction || 'ー', source: '手入力' }));
  return read('kakeibo.entries.v1', []).map(e => ({ id: e.id, created: e.created, date: e.date, amount: e.amount,
    kubun: e.type === 'income' ? K_INC : K_VAR, himoku: e.category, method: '', memo: e.memo || '', satisfaction: 'ー',
    source: '手入力' }));
}
function persist() { write(KEY, entries); }
function saveCfg() { write(KEY_CFG, cfg); }
function markDirty() { cfg.ver = (cfg.ver || 0) + 1; saveCfg(); }
const isDirty = () => cfg.ver !== cfg.syncedVer;

// ---- helpers ----
const yen = n => (n < 0 ? '−¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
const num = n => Math.round(n).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mkOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const monthKey = () => mkOf(cur);
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const byDate = (a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0);
const toInt = s => { const n = parseInt(String(s).normalize('NFKC').replace(/[^\d-]/g, ''), 10); return isNaN(n) ? 0 : n; };
const isIncome = e => e.kubun === K_INC;
const newId = () => crypto.randomUUID();
const graphemes = s => (window.Intl && Intl.Segmenter
  ? [...new Intl.Segmenter('ja', { granularity: 'grapheme' }).segment(s)].map(x => x.segment) : Array.from(s)).filter(x => x.trim());
const stamps = () => { const g = graphemes(prefs.stamp || ''); return g.length ? g : ['🐧']; };

function itemOf(kubun, himoku) { return master.items.find(i => i.kubun === kubun && i.himoku === himoku); }
function itemsOf(kubun) {
  const list = master.items.filter(i => i.kubun === kubun).sort((a, b) => a.order - b.order).map(i => i.himoku);
  const known = new Set(list);
  for (const e of entries) if (e.kubun === kubun && !known.has(e.himoku)) { known.add(e.himoku); list.push(e.himoku); }
  return list;
}
const budgetOf = (kubun, himoku) => itemOf(kubun, himoku)?.budget || 0;
function allMethods() {
  const s = new Set(master.methods);
  master.items.forEach(i => i.methods.forEach(m => s.add(m)));
  entries.forEach(e => e.method && s.add(e.method));
  return [...s];
}

function agg(list) {
  const sum = {}, by = {};
  KUBUNS.forEach(k => { sum[k] = 0; by[k] = {}; });
  for (const e of list) {
    sum[e.kubun] = (sum[e.kubun] || 0) + e.amount;
    const b = by[e.kubun] || (by[e.kubun] = {});
    b[e.himoku] = (b[e.himoku] || 0) + e.amount;
  }
  return { sum, by };
}
const monthEntries = mk => entries.filter(e => e.date.startsWith(mk));

// weeks start on Monday; a 6th partial week is merged into week 5 (same as the spreadsheet)
function weeksOf(y, m) {
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, n = daysIn(y, m), weeks = [];
  for (let d = 1; d <= n; d++) {
    const w = Math.min(5, Math.floor((d - 1 + offset) / 7) + 1);
    (weeks[w - 1] ||= { n: w, days: [] }).days.push(d);
  }
  return weeks;
}

function ring(pct, color, size = 104, stroke = 10) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(pct, 1));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--chip)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})"
      style="transition:stroke-dashoffset .5s ease"/></svg>`;
}

// ---- toast ----
let toastTimer;
function toast(msg, action) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); action.run(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2200);
}

// ---- render ----
function render(anim) {
  const y = cur.getFullYear(), mo = cur.getMonth();
  $('monthLabel').textContent = tab === 'settings' ? '設定' : tab === 'year' ? `${fiscalYear()}年度` : `${y}年${mo + 1}月`;
  $('prev').style.visibility = $('next').style.visibility = tab === 'settings' ? 'hidden' : '';
  $('gear').classList.toggle('on', tab === 'settings');
  $('syncLine').textContent = cfg.url && (isDirty() || cfg.error)
    ? `スプレッドシート未反映の変更あり${cfg.error ? '（' + cfg.error + '）' : ''}` : '';
  document.querySelectorAll('.tabbar [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const main = $('main');
  main.className = '';
  void main.offsetWidth;
  main.className = anim || '';
  ({ home: renderHome, list: renderList, week: renderWeek, year: renderYear, settings: renderSettings })[tab]();
}

// one row of "actual vs budget"
function barRow(name, actual, budget, kubun, cls = '') {
  const income = kubun === K_INC;
  const over = !income && budget > 0 && actual > budget;
  const w = budget > 0 ? Math.min(actual / budget, 1) * 100 : 0;
  const diff = budget > 0
    ? (income ? `目安との差 ${yen(actual - budget)}` : over ? `${yen(actual - budget)} オーバー` : `のこり ${yen(budget - actual)}`) : '';
  return `<div class="bar-row ${cls}"><div class="top"><span>${esc(name)}</span>
    <span>${yen(actual)}${budget > 0 ? ` <small>/ ${yen(budget)}</small>` : ''}</span></div>
    ${budget > 0 ? `<div class="bar"><i style="width:${w}%;background:${over ? 'var(--c3-ink)' : kcolor(kubun)}"></i></div>
    <div class="diff ${over ? 'over' : ''}">${diff}</div>` : ''}</div>`;
}

function budgetList(kubun, by, extraBudget) {
  const names = itemsOf(kubun).filter(h => by[h] || budgetOf(kubun, h));
  const total = names.reduce((s, h) => s + (by[h] || 0), 0);
  const budget = extraBudget ?? names.reduce((s, h) => s + budgetOf(kubun, h), 0);
  return barRow(`${SHORT[kubun]}の合計`, total, budget, kubun, 'total first') +
    names.map(h => barRow(h, by[h] || 0, budgetOf(kubun, h), kubun)).join('');
}

function renderHome() {
  const mk = monthKey(), list = monthEntries(mk), { sum, by } = agg(list);
  const a = sum[K_INC], b = sum[K_SAVE], c = sum[K_FIX], d = a - b - c, v = sum[K_VAR], s = sum[K_SP];
  const used = v + s, rest = d - used, rate = a ? used / a * 100 : 0, out = b + c + v + s;
  const y = cur.getFullYear(), mo = cur.getMonth(), n = daysIn(y, mo), now = new Date(), today = ymd(now);
  const thisMonth = now.getFullYear() === y && now.getMonth() === mo;
  const daysLeft = n - now.getDate() + 1;
  const pct = d > 0 ? used / d : used > 0 ? 1 : 0;
  const plan = specials[mk] || [];
  homeSeg ||= K_VAR;

  // calendar of variable spending; days without spending get this week's stamp
  const weeks = weeksOf(y, mo), st = stamps();
  const weekOfDay = {};
  weeks.forEach(w => w.days.forEach(dd => weekOfDay[dd] = w.n));
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
  const daily = {};
  list.forEach(e => { if (e.kubun === K_VAR) daily[e.date] = (daily[e.date] || 0) + e.amount; });
  let cal = '月火水木金土日'.split('').map((w, i) => `<div class="wd ${i === 5 ? 'sat' : i === 6 ? 'sun' : ''}">${w}</div>`).join('') +
    '<div></div>'.repeat(offset);
  let noSpend = 0;
  for (let day = 1; day <= n; day++) {
    const ds = `${mk}-${pad(day)}`, amt = daily[ds] || 0, past = ds < today;
    if (past && !amt) noSpend++;
    cal += `<button data-day="${ds}" class="${ds === today ? 'today' : ''}${ds > today ? ' future' : ''}"><span class="dn">${day}</span>${
      amt ? `<span class="dv">${num(amt)}</span>` : past ? `<span class="ds">${st[(weekOfDay[day] - 1) % st.length]}</span>` : '<span></span>'}</button>`;
  }

  const segs = [K_VAR, K_FIX, K_SP, K_SAVE, K_INC];
  $('main').innerHTML = `
    <section class="card hero">
      <div class="ring-wrap">${ring(pct, rest < 0 ? 'var(--c3-ink)' : 'var(--c1)')}
        <div class="ring-label"><small>使った</small><b>${Math.round(pct * 100)}%</b></div></div>
      <div class="hero-text"><small>${thisMonth ? '今月あと使えるお金' : 'やりくりの残り'}</small>
        <div class="big ${rest < 0 ? 'neg' : ''}">${yen(rest)}</div>
        <div class="sub">${thisMonth && rest > 0 ? `1日あたり <b class="num">${yen(rest / daysLeft)}</b>・あと${daysLeft}日<br>` : ''}やりくり予算 ${yen(d)}</div></div>
    </section>
    <div class="stats">
      <div><small>収入</small><b>${yen(a)}</b></div>
      <div><small>支出・貯蓄</small><b>${yen(out)}</b></div>
      <div><small>収支</small><b class="${a - out < 0 ? 'neg' : ''}">${yen(a - out)}</b></div>
    </div>
    <details class="card fold"><summary>やりくり予算の内訳<span>${yen(d)}</span></summary>
      <div class="kv"><span>収入 (a)</span><span>${yen(a)}</span></div>
      <div class="kv"><span>先取り貯金・投資 (b)</span><span>−${yen(b)}</span></div>
      <div class="kv"><span>固定費 (c)</span><span>−${yen(c)}</span></div>
      <div class="kv em"><span>やりくり予算 (d) <small>a−b−c</small></span><span>${yen(d)}</span></div>
      <div class="kv"><span>変動費</span><span>−${yen(v)}</span></div>
      <div class="kv"><span>特別費</span><span>−${yen(s)}</span></div>
      <div class="kv em"><span>のこり</span><span class="${rest < 0 ? 'neg' : ''}">${yen(rest)}</span></div>
      <div class="kv"><span>支出率 <small>(変動費+特別費)÷収入</small></span><span>${rate.toFixed(1)}%</span></div>
    </details>
    <section class="card">
      <div class="card-head"><h3>変動費カレンダー</h3><span class="muted">${st.join('')} 使わなかった日 ${noSpend}日</span></div>
      <div class="cal">${cal}</div>
    </section>
    <section class="card">
      <div class="hscroll">${segs.map(k => `<button class="pill ${k === homeSeg ? 'on' : ''}" data-hs="${k}">
        <i class="dot" style="background:${kcolor(k)}"></i>${PILL[k]}</button>`).join('')}</div>
      ${homeSeg === K_SP ? `<div class="card-head"><h3>特別費の予定</h3><button id="addPlan">＋ 追加</button></div>
        ${plan.map(p => `<button class="row nav" data-plan="${p.id}"><span class="l"><span>${esc(p.name)}${
          p.note ? ` <small class="muted">${esc(p.note)}</small>` : ''}</span></span><span class="r">${yen(p.budget)}</span></button>`).join('') ||
          '<p class="note" style="margin:0 16px 10px">固定資産税や年会費など、今月の予定を入れておくと予算になります</p>'}` : ''}
      ${budgetList(homeSeg, by[homeSeg], homeSeg === K_SP && plan.length ? plan.reduce((t, p) => t + p.budget, 0) : undefined)}
    </section>`;
  $('main').querySelector('.cal').onclick = e => {
    const btn = e.target.closest('[data-day]');
    if (!btn || !daily[btn.dataset.day]) return;
    listFilter = 'all'; listQuery = '';
    tab = 'list'; render();
    $('d-' + btn.dataset.day)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  };
  $('main').querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { homeSeg = b.dataset.hs; render(); });
  $('addPlan') && ($('addPlan').onclick = () => editPlan(null));
  $('main').querySelectorAll('[data-plan]').forEach(b => b.onclick = () => editPlan(plan.find(p => p.id === b.dataset.plan)));
}

function renderList() {
  $('main').innerHTML = `
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="q" placeholder="お店・費目・メモで検索（全期間）" value="${esc(listQuery)}"></label>
    <div class="hscroll filters" style="margin:0 -16px">${['all', K_VAR, K_FIX, K_SP, K_SAVE, K_INC].map(k => `<button class="pill ${k === listFilter ? 'on' : ''}" data-lf="${k}">${
      k === 'all' ? 'すべて' : `<i class="dot" style="background:${kcolor(k)}"></i>${PILL[k]}`}</button>`).join('')}</div>
    <div id="listBody"></div>`;
  $('q').oninput = e => { listQuery = e.target.value; renderListBody(); };
  $('main').querySelectorAll('[data-lf]').forEach(b => b.onclick = () => {
    listFilter = b.dataset.lf;
    $('main').querySelectorAll('[data-lf]').forEach(x => x.classList.toggle('on', x === b));
    renderListBody();
  });
  renderListBody();
}

function renderListBody() {
  const q = norm(listQuery).toLowerCase();
  let list = q ? entries.filter(e => norm(`${e.himoku} ${e.memo} ${e.method}`).toLowerCase().includes(q)) : monthEntries(monthKey());
  if (listFilter !== 'all') list = list.filter(e => e.kubun === listFilter);
  if (!list.length) {
    $('listBody').innerHTML = `<div class="empty"><span class="em">${q ? '🔍' : stamps()[0]}</span>${
      q ? '見つかりませんでした' : 'この月の記録はまだありません<br>下の ＋ から記録しましょう'}</div>`;
    return;
  }
  const byDay = {};
  list.slice().sort((a, b) => byDate(b, a)).forEach(e => (byDay[e.date] ||= []).push(e));
  const wd = '日月火水木金土';
  const total = list.reduce((s, e) => s + (isIncome(e) ? 0 : e.amount), 0);
  $('listBody').innerHTML = (q ? `<p class="note">${list.length}件・支出と貯蓄の合計 ${yen(total)}</p>` : '') +
    Object.entries(byDay).slice(0, q ? 60 : 99).map(([date, items]) => {
      const d = new Date(date + 'T00:00');

      return `<div class="day" id="d-${date}"><div class="day-head"><span>${q ? d.getFullYear() + '年' : ''}${d.getMonth() + 1}月${d.getDate()}日（${wd[d.getDay()]}）</span>

}

function renderWeek() {
  const y = cur.getFullYear(), mo = cur.getMonth(), mk = monthKey(), n = daysIn(y, mo);
  const weeks = weeksOf(y, mo), now = new Date();
  const thisMonth = now.getFullYear() === y && now.getMonth() === mo;
  if (weekSel == null || weekSel > weeks.length) weekSel = thisMonth ? weeks.find(w => w.days.includes(now.getDate())).n : 1;
  const wk = weeks[weekSel - 1];
  const items = master.items.filter(i => i.kubun === K_VAR && i.weekly).sort((a, b) => a.order - b.order);
  if (!items.length) {
    $('main').innerHTML = '<div class="empty"><span class="em">🗓</span>週ごとに管理する費目がありません<br>設定 → 費目・予算 で「週ごとに管理する」をオンにしてください</div>';
    return;
  }
  const varList = monthEntries(mk).filter(e => e.kubun === K_VAR);
  const inWeek = varList.filter(e => wk.days.includes(+e.date.slice(8)));
  const spent = (list, h) => list.filter(e => e.himoku === h).reduce((s, e) => s + e.amount, 0);
  const rows = items.map(i => ({ name: i.himoku, budget: i.budget * wk.days.length / n, actual: spent(inWeek, i.himoku) }));
  const tb = rows.reduce((s, r) => s + r.budget, 0), ta = rows.reduce((s, r) => s + r.actual, 0), rest = tb - ta;
  const mRows = items.map(i => ({ name: i.himoku, budget: i.budget, actual: spent(varList, i.himoku) }));
  const label = w => `${mo + 1}/${w.days[0]}–${w.days[w.days.length - 1]}`;
  const isNow = thisMonth && wk.days.includes(now.getDate());
  const left = isNow ? wk.days.filter(d => d >= now.getDate()).length : 0;

  $('main').innerHTML = `
    <div class="hscroll weeks">${weeks.map(w => `<button class="pill ${w.n === weekSel ? 'on' : ''}" data-w="${w.n}"><b>${w.n}週目</b>${label(w)}</button>`).join('')}</div>
    <section class="card hero" style="margin-top:8px">
      <div class="ring-wrap">${ring(tb ? ta / tb : 0, rest < 0 ? 'var(--c3-ink)' : 'var(--c3)')}
        <div class="ring-label"><small>使った</small><b>${tb ? Math.round(ta / tb * 100) : 0}%</b></div></div>
      <div class="hero-text"><small>${weekSel}週目のこり（${wk.days.length}日間）</small>
        <div class="big ${rest < 0 ? 'neg' : ''}">${yen(rest)}</div>
        <div class="sub">${isNow && rest > 0 ? `1日あたり <b class="num">${yen(rest / left)}</b>・あと${left}日<br>` : ''}週の予算 ${yen(tb)}</div></div>
    </section>
    <section class="card">${rows.map((r, i) => barRow(r.name, r.actual, r.budget, K_VAR, i ? '' : 'first')).join('')}</section>
    <p class="note">週の予算 ＝ 月の予算 × その週の日数 ÷ ${n}日</p>
    <div class="label">${mo + 1}月の合計（週ごとに管理する費目）</div>
    <section class="card">${barRow('合計', mRows.reduce((s, r) => s + r.actual, 0), mRows.reduce((s, r) => s + r.budget, 0), K_VAR, 'total first')}
      ${mRows.map(r => barRow(r.name, r.actual, r.budget, K_VAR)).join('')}</section>`;
  $('main').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { weekSel = +b.dataset.w; render(); });
  $('main').querySelector('.weeks .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

const fiscalYear = () => cur.getMonth() >= 3 ? cur.getFullYear() : cur.getFullYear() - 1;

function renderYear() {
  const fy = fiscalYear();
  const months = Array.from({ length: 12 }, (_, i) => new Date(fy, 3 + i, 1));
  const now = new Date();
  const started = months.map(d => d <= now);
  const nStarted = Math.max(started.filter(Boolean).length, 1);
  const data = months.map(d => agg(monthEntries(mkOf(d))));
  const avg = vals => vals.reduce((s, v, i) => s + (started[i] ? v : 0), 0) / nStarted;
  const cells = vals => vals.map(v => `<td>${v ? num(v) : ''}</td>`).join('') + `<td>${num(avg(vals))}</td>`;
  const head = `<tr><th>項目</th>${months.map(d => `<th>${d.getMonth() + 1}月</th>`).join('')}<th>月平均</th></tr>`;

  const totals = KUBUNS.map(k => data.map(m => m.sum[k] || 0));
  const outTotal = months.map((_, i) => totals.slice(1).reduce((s, t) => s + t[i], 0));
  const balance = months.map((_, i) => totals[0][i] - outTotal[i]);
  let body = `<tr class="total"><td>収支</td>${cells(balance)}</tr>`;
  for (const [ki, k] of KUBUNS.entries()) {
    body += `<tr class="grp"><td><span><i class="dot" style="background:${kcolor(k)}"></i>${SHORT[k]}</span></td>${cells(totals[ki])}</tr>`;
    for (const h of itemsOf(k)) {
      const vals = data.map(m => m.by[k]?.[h] || 0);
      if (vals.some(Boolean)) body += `<tr><td>${esc(h)}</td>${cells(vals)}</tr>`;
    }
  }
  const max = Math.max(...outTotal, ...totals[0], 1);
  $('main').innerHTML = `
    <div class="stats">
      <div><small>収入の合計</small><b>${yen(totals[0].reduce((s, v) => s + v, 0))}</b></div>
      <div><small>支出・貯蓄</small><b>${yen(outTotal.reduce((s, v) => s + v, 0))}</b></div>
      <div><small>収支</small><b class="${balance.reduce((s, v) => s + v, 0) < 0 ? 'neg' : ''}">${yen(balance.reduce((s, v) => s + v, 0))}</b></div>
    </div>
    <section class="card">
      <div class="card-head"><h3>月ごとの推移</h3></div>
      <div class="legend"><span><i class="dot" style="background:var(--c1)"></i>収入</span><span><i class="dot" style="background:var(--c3)"></i>支出・貯蓄</span><span>右：収支</span></div>
      <div class="mbars">${months.map((d, i) => `<div class="mbar"><span class="muted">${d.getMonth() + 1}月</span>
        <div class="tracks"><i style="width:${totals[0][i] / max * 100}%;background:var(--c1)"></i><i style="width:${outTotal[i] / max * 100}%;background:var(--c3)"></i></div>
        <span class="${balance[i] < 0 ? 'neg' : ''}">${started[i] ? yen(balance[i]) : ''}</span></div>`).join('')}</div>
    </section>
    <section class="card">
      <div class="card-head"><h3>費目別</h3><span class="muted">${fy}年4月〜${fy + 1}年3月</span></div>
      <div class="tbl-wrap"><table>${head}${body}</table></div>
    </section>
    <p class="note">月平均は始まっている${nStarted}か月で割っています。記録のない費目は省いています。</p>`;
}

// ---- sheets: open / close / drag down to close ----
function openSheet(wrap) { wrap.classList.add('open'); }
function closeSheet(wrap) { wrap.classList.remove('open'); document.activeElement?.blur(); }
function draggable(sheet, close) {
  let y0 = null, dy = 0;
  sheet.addEventListener('touchstart', e => {
    if (sheet.scrollTop > 0 || e.target.closest('input,select,textarea,.chips,.tbl-wrap')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 8) { sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 == null) return;
    sheet.style.transition = ''; sheet.style.transform = '';
    if (dy > 110) close();
    y0 = null;
  });
}

function openPanel(html) {
  $('panel').innerHTML = '<div class="grip"></div>' + html;
  openSheet($('panelWrap'));
  $('panel').scrollTop = 0;
  $('panel').querySelectorAll('[data-close]').forEach(b => b.onclick = closePanel);
}

$('panelBg').onclick = closePanel;

function methodOptions(selected, blank = '（なし）') {
  const list = allMethods();

  return `<option value="">${blank}</option>` + list.map(m => `<option${m === selected ? ' selected' : ''}>${esc(m)}</option>`).join('');
}
const amountInput = el => el.oninput = () => {

};

function editItem(it) {
  const isNew = !it;
  const cur0 = it || { kubun: K_VAR, himoku: '', methods: [], budget: 0, order: 99, weekly: false, note: '' };
  openPanel(`<h3>${isNew ? '費目を追加' : '費目を編集'}</h3>
    <div class="form-list">
      <div class="inline-field"><span>区分</span><select id="iKubun">${KUBUNS.map(k => `<option value="${k}"${k === cur0.kubun ? ' selected' : ''}>${k}</option>`).join('')}</select></div>

      <div class="inline-field"><span>月の予算</span><input id="iBudget" inputmode="numeric" placeholder="0" value="${cur0.budget ? num(cur0.budget) : ''}"></div>
      <div class="inline-field"><span>支払方法</span><select id="iMethod">${methodOptions(cur0.methods[0], '（指定なし）')}</select></div>
      <div class="inline-field"><span>表示順</span><input id="iOrder" inputmode="numeric" value="${cur0.order}"></div>
      <div class="inline-field" id="iWeeklyRow"><span>週予算</span><label class="check"><input type="checkbox" id="iWeekly"${cur0.weekly ? ' checked' : ''}>週ごとに管理する</label></div>
      <div class="inline-field"><span>内容</span><input id="iNote" value="${esc(cur0.note)}" placeholder="入力時のヒントに表示"></div>
    </div>
    <div class="actions">${isNew ? '' : '<button type="button" class="del" id="iDel">削除</button>'}
      <button type="button" data-close>閉じる</button><button type="button" class="save" id="iSave">保存</button></div>`);
  amountInput($('iBudget'));
  const toggleWeekly = () => $('iWeeklyRow').style.display = $('iKubun').value === K_VAR ? '' : 'none';
  $('iKubun').onchange = toggleWeekly; toggleWeekly();
  $('iSave').onclick = () => {
    const kubun = $('iKubun').value, himoku = $('iName').value.trim();
    if (!himoku) { $('iName').focus(); return; }
    const dup = itemOf(kubun, himoku);
    if (dup && dup !== it) { toast('同じ区分に同じ名前の費目があります'); return; }
    const m = $('iMethod').value;
    const next = { kubun, himoku, budget: toInt($('iBudget').value), order: toInt($('iOrder').value) || 99,
      weekly: kubun === K_VAR && $('iWeekly').checked, note: $('iNote').value.trim(),
      methods: m ? [m, ...cur0.methods.filter(x => x !== m)] : [] };
    if (isNew) master.items.push(next);
    else {
      // renaming a 費目 also renames past records
      if (it.kubun !== kubun || it.himoku !== himoku) {
        let changed = 0;
        entries.forEach(e => { if (e.kubun === it.kubun && e.himoku === it.himoku) { e.kubun = kubun; e.himoku = himoku; changed++; } });
        if (changed) { persist(); markDirty(); }
      }
      Object.assign(it, next);
    }
    write(KEY_MASTER, master);
    closePanel(); render(); sync(); toast('保存しました');
  };
  $('iDel') && ($('iDel').onclick = () => {
    if (!confirm(`「${it.himoku}」を費目の一覧から削除しますか？\n（過去の記録はそのまま残ります）`)) return;
    master.items = master.items.filter(x => x !== it);
    write(KEY_MASTER, master); closePanel(); render(); toast('費目を削除しました');
  });
}

// ---- sync with Google Sheets (Apps Script web app) ----
async function post(body) {
  const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, ...body }) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error === 'token' ? '合言葉が違います' : data.error);
  return data;
}
const errMsg = err => err instanceof TypeError ? '接続できませんでした' : err.message;

async function pullMaster() {
  const data = await post({ action: 'master' });
  if (!data.items || !data.items.length) throw new Error('費目が見つかりませんでした');
  master = { items: data.items, methods: [...new Set([...DEFAULT_METHODS, ...data.items.flatMap(i => i.methods)])], fromSheet: true };
  write(KEY_MASTER, master);
}

async function connect() {
  cfg.url = $('cUrl').value.trim(); cfg.token = $('cToken').value; cfg.error = '';
  saveCfg();
  if (!cfg.url) { render(); return; }
  if (!cfg.lastSync && !confirm('初回の同期では、01_Raw_Data の記録をすべてアプリに取り込み、以後はアプリの内容をシートに書き写します。\n初回にシートのバックアップ（01_Raw_Data_backup_日付）が自動で作られます。\n\n続けますか？')) return;
  if (!master.fromSheet) { try { await pullMaster(); } catch (err) { toast('費目・予算は読み込めませんでした：' + errMsg(err)); } }
  await sync({ manual: true });
}

let syncing = false;
async function sync({ manual = false, force = false } = {}) {
  if (!cfg.url || syncing) return;
  const stale = Date.now() - (cfg.lastSync || 0) > 30 * 60 * 1000;
  if (!manual && !force && !isDirty() && !stale) return;
  if (!navigator.onLine) { if (manual) toast('オフラインのため同期できません'); return; }
  syncing = true;
  const sentVer = cfg.ver;
  let added = [];
  try {
    const rows = entries.slice().sort(byDate)
      .map(e => [e.date, e.amount, e.kubun, e.himoku, e.method, e.memo, e.satisfaction, e.source]);
    const data = await post({ action: 'sync', rows });
    added = data.added || [];
    added.forEach(r => entries.push({ id: newId(), created: Date.now(), date: r[0], amount: Number(r[1]), kubun: r[2],
      himoku: r[3], method: r[4], memo: r[5], satisfaction: r[6], source: r[7] }));
    cfg.syncedVer = sentVer;
    if (added.length) cfg.ver++;   // write them back so they become part of the app's copy
    cfg.lastSync = Date.now(); cfg.error = '';
    persist();
    if (manual) toast(`同期しました（シートから ${added.length}件 取り込み）`);
  } catch (err) {
    cfg.error = errMsg(err);
    if (manual) toast('同期に失敗しました：' + cfg.error);
  } finally {
    syncing = false;
    saveCfg();
    render();
  }
  if (added.length) sync({ force: true });
}

// ---- CSV backup (same column order as 01_Raw_Data B–I) ----
const CSV_HEAD = ['利用日', '金額', '区分', '費目', '入出金方法', '詳細', '満足度', 'データ元'];
const csvCell = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;

async function exportCsv() {
  const rows = [CSV_HEAD].concat(entries.slice().sort(byDate)
    .map(e => [e.date, String(e.amount), e.kubun, e.himoku, e.method, e.memo, e.satisfaction, e.source]));
  const text = '﻿' + rows.map(r => r.map(c => csvCell(c || '')).join(',')).join('\r\n');
  const name = `kakeibo-${ymd(new Date())}.csv`;
  const file = new File([text], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
  catch { return new TextDecoder('shift_jis').decode(buf); }   // 三井住友カードの明細は Shift_JIS
}
function toYmd(s) {
  const m = /^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/.exec(String(s || '').trim());
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
}

$('importFile').onchange = async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  const rows = parseCsv(await readText(file));
  const added = [];
  for (const r of rows) {
    // 01_Raw_Data downloaded straight from the sheet has 取引ID in column A
    const skip = !toYmd(r[0]) && toYmd(r[1]) ? 1 : 0;
    const [date, amount, kubun, himoku, method, memo, sat, source] = r.slice(skip);
    const d = toYmd(date), n = toInt(amount);
    if (!d || !n) continue;
    added.push({ id: newId(), created: Date.now(), date: d, amount: n, kubun: kubun || K_VAR, himoku: himoku || '❓ その他',
      method: method || '', memo: memo || '', satisfaction: sat || 'ー', source: source || '手入力' });
  }
  if (!added.length) { toast('読み込める行がありませんでした'); return; }
  const replace = entries.length && confirm(`${added.length}件を読み込みます。\n\nOK：今のデータを置き換える\nキャンセル：今のデータに追加する`);
  entries = replace ? added : entries.concat(added);
  persist(); markDirty(); render(); sync();
  toast(`${added.length}件を読み込みました`);
};

// ---- card statement import ----
// Compare store names loosely: full-width → half-width, all dash variants → "-"
const norm = s => String(s || '').normalize('NFKC').replace(/[‐-―−－]/g, '-').replace(/\s+/g, ' ').trim();
const dupKey = (date, amount, method, memo) => `${date}|${amount}|${method}|${norm(memo)}`;

const CARD_RULES = [
  [/まいばすけっと|ヨーカドー.*食|イオン|ライフ|西友|サミット|成城石井|業務スーパー|オーケー|マルエツ|コープ|生協/, K_VAR, '🍙 食費'],
  [/セブン|ファミリーマート|ローソン/, K_VAR, '🍙 食費'],
  [/スターバックス|ドトール|タリーズ|マクドナルド|すき家|吉野家|松屋|サイゼリヤ|ガスト|UBER|出前館|カフェ|珈琲/i, K_VAR, '☕ 外食・カフェ'],
  [/PASMO|SUICA|JR|タクシー|メトロ|鉄道|バス/i, K_VAR, '🚃 交通費'],
  [/マツモトキヨシ|ウエルシア|ツルハ|スギ薬局|サンドラッグ|無印良品|ダイソー|セリア|ニトリ|AMAZON/i, K_VAR, '🧴 日用品'],
  [/病院|クリニック|医院|歯科|調剤/, K_VAR, '🏥 医療費'],
  [/ユニクロ|UNIQLO|GU|しまむら|クリーニング|美容/i, K_VAR, '👕 衣服・美容'],
];

function learnedCategories() {
  const exact = new Map(), prefix = new Map();
  for (const e of entries.slice().sort(byDate)) {   // newest wins
    if (!e.memo || e.kubun === K_INC) continue;
    const n = norm(e.memo);
    exact.set(n, e);
    if (n.length >= 4) prefix.set(n.slice(0, 6), e);
  }
  return memo => {
    const n = norm(memo);
    const hit = exact.get(n) || (n.length >= 4 && prefix.get(n.slice(0, 6)));
    if (hit) return { kubun: hit.kubun, himoku: hit.himoku, how: '過去の記録' };
    for (const [re, kubun, himoku] of CARD_RULES) if (re.test(n) && itemsOf(kubun).includes(himoku)) return { kubun, himoku, how: '店名から推定' };
    return { kubun: K_VAR, himoku: itemsOf(K_VAR).includes('❓ その他') ? '❓ その他' : itemsOf(K_VAR)[0], how: '' };
  };
}

function parseCard(name, text) {
  const rows = parseCsv(text), out = [];
  if (rows[0]?.[0] === '利用日') {   // 楽天カード e-NAVI
    for (const r of rows.slice(1)) {
      const d = toYmd(r[0]), amt = toInt(r[4]);
      if (d && amt) out.push({ date: d, memo: (r[1] || '').trim(), amount: amt, info: r[3] && r[3] !== '1回払い' ? r[3] : '' });
    }
    return { brand: '楽天カード', rows: out };
  }
  for (const r of rows) {           // 三井住友カード Vpass（1行目は名義、末尾はリボ等の合計行）
    const d = toYmd(r[0]), amt = toInt(r[2]);
    if (d && amt) out.push({ date: d, memo: (r[1] || '').trim(), amount: amt, info: r[3] ? `分割${toInt(r[3])}回の${toInt(r[4])}回目` : '' });
  }
  return { brand: '三井住友VISAカード', rows: out };
}

function guessMethod(file, parsed) {
  // 1) the method used by matching records already in the app
  const votes = {};
  const idx = new Map();
  entries.forEach(e => { if (e.method) idx.set(`${e.date}|${e.amount}|${norm(e.memo)}`, e.method); });
  parsed.rows.forEach(r => { const m = idx.get(`${r.date}|${r.amount}|${norm(r.memo)}`); if (m) votes[m] = (votes[m] || 0) + 1; });
  const best = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
  if (best) return best[0];
  // 2) remembered from a previous import of the same card
  const token = cardToken(file.name);
  if (cardMap[token]) return cardMap[token];
  // 3) "(c)" / "(s)" in the file name
  const methods = allMethods();
  const suffix = /\(([a-z])\)/i.exec(file.name)?.[1]?.toUpperCase();
  if (suffix && methods.includes(`${parsed.brand}(${suffix})`)) return `${parsed.brand}(${suffix})`;
  return methods.find(m => m.startsWith(parsed.brand)) || '';
}
const cardToken = name => name.replace(/\d{6}/, '').replace(/\.csv$/i, '');   // drop the yyyymm part

let importState = null;

$('cardFile').onchange = async ev => {
  const files = [...ev.target.files]; ev.target.value = '';
  if (!files.length) return;
  const classify = learnedCategories();
  const blocks = [];
  for (const file of files) {
    const parsed = parseCard(file.name, await readText(file));
    if (!parsed.rows.length) continue;
    blocks.push({ name: file.name, token: cardToken(file.name), method: guessMethod(file, parsed),
      rows: parsed.rows.map(r => ({ ...r, ...classify(r.memo), on: true })) });
  }
  if (!blocks.length) { toast('明細が見つかりませんでした（楽天・三井住友のCSVに対応）'); return; }
  importState = blocks;
  markDuplicates();
  renderImport();
};

// rows already in the app (same 利用日|金額|支払方法|詳細) are unchecked.
// Some older sheet rows have garbled store names ("ⅰ" saved as "�@"), so "�" + 1 char matches any one character.
function markDuplicates() {
  const have = {}, garbled = [];
  entries.forEach(e => {
    const k = dupKey(e.date, e.amount, e.method, e.memo);
    have[k] = (have[k] || 0) + 1;
    if (e.memo.includes('�')) garbled.push({ e, re: new RegExp('^' + e.memo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      .replace(/�[\s\S]?/g, '.') + '$') });
  });
  const used = new Set();
  for (const b of importState) for (const r of b.rows) {
    const k = dupKey(r.date, r.amount, b.method, r.memo);
    const g = !(have[k] > 0) && garbled.find(x => !used.has(x) && x.e.date === r.date && x.e.amount === r.amount &&
      x.e.method === b.method && x.re.test(r.memo));
    r.dup = have[k] > 0 || !!g;
    if (have[k] > 0) have[k]--;
    if (g) used.add(g);
    r.on = !r.dup && !r.info.startsWith('分割');   // installments: check by hand to avoid double counting
  }
}

function renderImport() {
  const catOptions = KUBUNS.filter(k => k !== K_INC).map(k => `<optgroup label="${SHORT[k]}">${itemsOf(k)
    .map(h => `<option value="${esc(k + '|' + h)}">${esc(h)}</option>`).join('')}</optgroup>`).join('');
  const count = importState.reduce((s, b) => s + b.rows.filter(r => r.on).length, 0);
  const dups = importState.reduce((s, b) => s + b.rows.filter(r => r.dup).length, 0);
  openPanel(`<h3>カード明細の取り込み</h3>
    <p class="note" style="margin-top:0">登録済みの ${dups}件 は除外しました。費目を確認して取り込んでください。</p>
    ${importState.map((b, i) => `<div class="label">${esc(b.name)}</div>
      <div class="form-list" style="margin-bottom:8px"><div class="inline-field"><span>支払方法</span><select data-bm="${i}">${methodOptions(b.method, '（選択してください）')}</select></div></div>
      <div class="card" style="box-shadow:none;border:1px solid var(--line)">${b.rows.map((r, j) => `<div class="imp-row${r.dup ? ' dup' : ''}">
        <input type="checkbox" data-on="${i}-${j}"${r.on ? ' checked' : ''} aria-label="取り込む">
        <div class="body"><div class="name">${esc(r.memo)}</div>
          <small class="${!r.dup && !r.how ? 'unk' : ''}">${r.date.slice(5).replace('-', '/')}${r.info ? '・' + esc(r.info) : ''}・${
            r.dup ? '登録済み' : r.info.startsWith('分割') ? '分割払い：取り込むか確認' : r.how || '費目を確認'}</small>
          <select data-cat="${i}-${j}">${catOptions}</select></div>
        <b>${yen(r.amount)}</b></div>`).join('')}</div>`).join('')}
    <div class="actions sticky-actions">
      <button type="button" data-close>閉じる</button>
      <button type="button" class="save" id="impGo">${count}件を取り込む</button></div>`);
  const panel = $('panel');
  panel.querySelectorAll('[data-cat]').forEach(s => {
    const [i, j] = s.dataset.cat.split('-').map(Number), r = importState[i].rows[j];
    s.value = r.kubun + '|' + r.himoku;
    s.onchange = () => { const [k, ...h] = s.value.split('|'); r.kubun = k; r.himoku = h.join('|'); r.how = r.how || '手動'; };
  });
  panel.querySelectorAll('[data-on]').forEach(c => c.onchange = () => {
    const [i, j] = c.dataset.on.split('-').map(Number);
    importState[i].rows[j].on = c.checked;
    $('impGo').textContent = `${importState.reduce((s, b) => s + b.rows.filter(r => r.on).length, 0)}件を取り込む`;
  });
  panel.querySelectorAll('[data-bm]').forEach(s => s.onchange = () => {
    importState[+s.dataset.bm].method = s.value;
    const top = panel.scrollTop;
    markDuplicates(); renderImport(); $('panel').scrollTop = top;
  });
  $('impGo').onclick = () => {
    if (importState.some(b => !b.method && b.rows.some(r => r.on))) { toast('支払方法を選んでください'); return; }
    const added = [];
    for (const b of importState) {
      cardMap[b.token] = b.method;
      for (const r of b.rows) if (r.on) added.push({ id: newId(), created: Date.now(), date: r.date, amount: r.amount,
        kubun: r.kubun, himoku: r.himoku, method: b.method, memo: r.memo, satisfaction: 'ー', source: 'カードCSV' });
    }
    entries.push(...added);
    write(KEY_CARDMAP, cardMap);
    persist(); markDirty(); closePanel(); render(); sync();
    const ids = new Set(added.map(e => e.id));
    toast(`${added.length}件を取り込みました`, added.length ? { label: '元に戻す', run: () => {
      entries = entries.filter(e => !ids.has(e.id)); persist(); markDirty(); render(); sync();
    } } : null);
  };
}

// ---- entry form ----
const kindOf = k => k === K_INC ? 'income' : k === K_SAVE ? 'saving' : 'expense';
const KIND_KUBUN = { income: K_INC, saving: K_SAVE };

function setKubun(k) {
  f.kubun = k;
  const kind = kindOf(k);
  document.querySelectorAll('#kindSeg button').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
  document.querySelectorAll('#subSeg button').forEach(b => b.classList.toggle('on', b.dataset.kubun === k));
  $('subSeg').style.display = kind === 'expense' ? '' : 'none';
  $('satField').style.display = kind === 'expense' ? '' : 'none';
  $('fCats').style.setProperty('--kc', kcolor(k).replace(')', '-ink)'));   // the deeper shade of the 区分 color
  const cats = itemsOf(k);
  if (!cats.includes(f.himoku)) f.himoku = cats[0] || '';
  $('fCats').innerHTML = cats.map(c => `<button type="button" class="${c === f.himoku ? 'on' : ''}">${esc(c)}</button>`).join('');
  setHimoku(f.himoku);
}
// choosing a 費目 shows its description and, for new records, fills in its usual payment method
function setHimoku(h, fillMethod) {
  f.himoku = h;
  const it = itemOf(f.kubun, h);
  $('fHint').textContent = it?.note || '';
  if (fillMethod && it?.methods[0]) $('fMethod').innerHTML = methodOptions(it.methods[0]);
}
function setSat(s) {
  f.sat = s;
  document.querySelectorAll('#satSeg button').forEach(b => b.classList.toggle('on', b.dataset.sat === s));
}

// keypad: parts are added together ("1,280 + 300"), handy for splitting receipts
const amountTotal = () => f.parts.reduce((s, p) => s + (Number(p) || 0), 0);
function showAmount() {
  $('amtVal').textContent = num(amountTotal());
  $('amtExpr').textContent = f.parts.length > 1 ? f.parts.map(p => p ? num(Number(p)) : '').join(' ＋ ') : '';
}
$('keypad').onclick = e => {
  const k = e.target.closest('[data-k]')?.dataset.k;
  if (!k) return;
  const last = f.parts.length - 1;
  if (k === 'back') { if (f.parts[last]) f.parts[last] = f.parts[last].slice(0, -1); else if (last) f.parts.pop(); }
  else if (k === 'clear') f.parts = [''];
  else if (k === 'plus') { if (f.parts[last]) f.parts.push(''); }
  else if (f.parts[last].length < 9 && !(f.parts[last] === '' && k.startsWith('0'))) f.parts[last] += k;
  showAmount();
};

function openForm(entry) {
  editing = entry ? entry.id : null;
  f.himoku = entry ? entry.himoku : '';
  f.parts = [entry ? String(entry.amount) : ''];
  showAmount();
  $('fMethod').innerHTML = methodOptions(entry ? entry.method : lastUsed.method);
  setKubun(entry ? entry.kubun : lastUsed.kubun);
  if (!entry) setHimoku(f.himoku, true);
  setSat(entry ? entry.satisfaction : 'ー');
  const today = new Date();
  const sameMonth = today.getFullYear() === cur.getFullYear() && today.getMonth() === cur.getMonth();
  $('fDate').value = entry ? entry.date : ymd(sameMonth ? today : cur);
  $('fMemo').value = entry ? entry.memo : '';
  $('fDelete').parentNode.style.display = entry ? '' : 'none';
  $('form').scrollTop = 0;
  openSheet($('sheetWrap'));
}
const closeForm = () => closeSheet($('sheetWrap'));

$('kindSeg').onclick = e => {
  const kind = e.target.dataset.kind;
  if (kind) setKubun(KIND_KUBUN[kind] || (kindOf(f.kubun) === 'expense' ? f.kubun : K_VAR));
};
$('subSeg').onclick = e => { if (e.target.dataset.kubun) setKubun(e.target.dataset.kubun); };
$('satSeg').onclick = e => { const b = e.target.closest('[data-sat]'); if (b) setSat(b.dataset.sat); };
$('fCats').onclick = e => {
  if (e.target.tagName !== 'BUTTON') return;
  $('fCats').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));

};
$('fMemo').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
$('form').onsubmit = e => {
  e.preventDefault();
  const amount = amountTotal();
  if (!amount) { toast('金額を入力してください'); return; }
  if (!$('fDate').value) { toast('日付を入力してください'); return; }
  const data = { kubun: f.kubun, himoku: f.himoku, amount, date: $('fDate').value, method: $('fMethod').value,
    memo: $('fMemo').value.trim(), satisfaction: kindOf(f.kubun) === 'expense' ? f.sat : 'ー' };
  let id = editing;
  if (editing) Object.assign(entries.find(x => x.id === editing), data);
  else { id = newId(); entries.push({ id, created: Date.now(), source: '手入力', ...data }); }
  lastUsed = { kubun: data.kubun, method: data.method }; write(KEY_LAST, lastUsed);
  persist(); markDirty();
  const [y, m] = data.date.split('-').map(Number);
  if (y !== cur.getFullYear() || m - 1 !== cur.getMonth()) { cur = new Date(y, m - 1, 1); weekSel = null; }

  closeForm(); render(); sync();
  toast(`${data.himoku} ${yen(amount)} を${wasNew ? '記録' : '更新'}しました`, wasNew ? { label: '取り消す', run: () => {
    entries = entries.filter(x => x.id !== id); persist(); markDirty(); render(); sync();
  } } : null);
};
$('fDelete').onclick = () => {
  const removed = entries.find(x => x.id === editing);

draggable($('form'), closeForm);

}, { passive: true });

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });

persist();
render();
sync();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
